# Copy to config.toml (or point $PACE_CONFIG at it). Every key is optional.
data_dir = "/var/lib/pace"
bind = "127.0.0.1"          # in practice the Tailscale IP; there is no app auth
port = 8420
agent_user = "pace-agent"
agent_home = "/home/pace-agent"
claude = "/home/pace-agent/.local/bin/claude"
run_timeout_minutes = 60
concurrency = 2             # global cap on simultaneous runs
